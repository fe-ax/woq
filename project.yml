name: WOQ
options:
  bundleIdPrefix: nl.feax
  deploymentTarget: { iOS: "26.0" }
  xcodeVersion: "26.6"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 375MMG6TQL
targets:
  WOQ:
    type: application
    platform: iOS
    sources: [WOQ]
    info:
      path: WOQ/App/Info.plist
      properties:
        CFBundleDisplayName: WOQ
        # Paper launch screen instead of white (Assets.xcassets/LaunchBackground.colorset, #F7F3E8).
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Documents/Backups shows up in Files under "On My iPhone > WOQ" and opens in place,
        # so woq-backup.json is reachable without any picker (WOQ/Backup/BackupFolder.swift).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: WOQ
        PRODUCT_BUNDLE_IDENTIFIER: nl.feax.woq
        # target level: XcodeGen's iOS application preset sets "1,2" here and would win over settings.base
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug: { MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE }
  # Swift Testing unit bundle (2026-09-12). Hosted by the app so `@testable import WOQ`
  # sees the app module; sources live in WOQTests/ — a SIBLING of WOQ/, because the app
  # target globs the whole WOQ/ directory and would otherwise compile the tests into the app.
  # The project-level `settings.base` above (Swift 6, MainActor default isolation, strict
  # concurrency) applies here too, so the tests run under exactly the app's rules.
  WOQTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WOQTests]
    dependencies:
      - target: WOQ
    settings:
      base:
        # No Info.plist file to keep in the repo: Xcode synthesises one for the bundle.
        GENERATE_INFOPLIST_FILE: YES
# One explicit scheme, so `xcodebuild test -scheme WOQ` runs the tests while a plain
# `xcodebuild build -scheme WOQ` only builds the app (WOQTests is marked "test only").
schemes:
  WOQ:
    build:
      targets:
        WOQ: all
        WOQTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WOQTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
